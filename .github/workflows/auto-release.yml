name: auto-release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

# One tagging run at a time. Parallel runs from a merge train each read the
# tag list before the others pushed, so they could compute the same N or tag
# out of order. Queued runs wait; they are never cancelled mid-run. GitHub
# keeps only the newest pending run per group, so a run replaced while
# waiting shows as cancelled. Nothing is lost: the run that replaced it
# checks every untagged commit since the last tag, so an earlier push that
# wanted a release still gets one (the tag lands on the newer commit, which
# contains it).
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # No job-level skip on head_commit.message: a `[skip release]` run can
    # replace the pending run of a push that wanted a release, so the skip
    # markers are evaluated over every untagged commit inside the job
    # (.github/scripts/next-release-tag.sh).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the built-in token for checkout; dispatch release explicitly after pushing the tag.
          token: ${{ github.token }}

      - name: Decide the release tag
        id: calver
        run: .github/scripts/next-release-tag.sh >> "$GITHUB_OUTPUT"

      - name: Create tag and dispatch release
        if: steps.calver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref main -f tag="$TAG"
